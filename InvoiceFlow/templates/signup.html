<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - InvoiceFlow</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 45px;

            border-bottom: 1px solid #222;
        }


        .logo {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -1px;
        }


        .logo span {
            color: #888;
        }


        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .sign-in {
            color: #fff;
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            padding: 12px 16px;

            transition: 0.2s;
        }


        .sign-in:hover {
            color: #aaa;
        }


        .sign-up {
            background: #fff;
            color: #000;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            padding: 12px 18px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .sign-up:hover {
            background: #ccc;
        }


        /* =========================
           SIGN UP CONTAINER
        ========================= */

        .signup-container {
            width: 100%;
            max-width: 460px;

            margin: 65px auto;

            padding: 0 20px;
        }


        /* =========================
           SIGN UP CARD
        ========================= */

        .signup-card {
            background: #080808;

            border: 1px solid #222;

            border-radius: 12px;

            padding: 35px;
        }


        .signup-header {
            margin-bottom: 30px;
        }


        .signup-header h1 {
            font-size: 28px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }


        .signup-header p {
            color: #777;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            color: #aaa;

            font-size: 12px;

            margin-bottom: 8px;
        }


        .form-group input {
            width: 100%;

            background: #000;

            color: #fff;

            border: 1px solid #333;

            border-radius: 7px;

            padding: 13px 14px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }


        .form-group input:focus {
            border-color: #777;
        }


        .form-group input::placeholder {
            color: #555;
        }


        .password-help {
            color: #666;

            font-size: 11px;

            line-height: 1.5;

            margin-top: 7px;
        }


        /* =========================
           TERMS
        ========================= */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin: 5px 0 22px;
        }


        .terms input {
            width: 14px;
            height: 14px;

            margin-top: 2px;

            accent-color: #fff;
        }


        .terms label {
            color: #777;

            font-size: 11px;

            line-height: 1.5;
        }


        .terms a {
            color: #fff;

            text-decoration: none;
        }


        .terms a:hover {
            text-decoration: underline;
        }


        /* =========================
           CREATE ACCOUNT BUTTON
        ========================= */

        .create-account-btn {
            width: 100%;

            border: none;

            background: #fff;

            color: #000;

            padding: 13px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .create-account-btn:hover {
            background: #ccc;
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            text-align: center;

            margin-top: 23px;

            color: #777;

            font-size: 13px;
        }


        .login-link a {
            color: #fff;

            text-decoration: none;

            font-weight: 600;
        }


        .login-link a:hover {
            color: #aaa;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }


            .signup-container {
                margin-top: 40px;
            }


            .signup-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>




    <!-- =========================
         SIGN UP
    ========================= -->

    <main class="signup-container">

        <div class="signup-card">


            <div class="signup-header">

                <h1>
                    Create your account
                </h1>

                <p>
                    Start managing your invoices with InvoiceFlow.
                </p>

            </div>



            <form>


                <!-- NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <div class="password-help">
                        Use at least 8 characters with a mix of letters and numbers.
                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>



                <!-- TERMS -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </label>

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="create-account-btn"
                >
                    Create Account
                </button>


            </form>



            <!-- LOGIN -->

            <div class="login-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Sign In
                </a>

            </div>


        </div>

    </main>


</body>

</html>
